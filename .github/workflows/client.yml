name: Klien Android

# Menguji klien Godot terhadap server asli, lalu membangun APK rilis (templat rilis: lebih cepat dan
# lebih kecil). APK ditandatangani dengan kunci yang sama seperti APK lama, jadi bisa menimpa tanpa uninstall.
# APK: tab Actions -> pilih run -> Artifacts. Untuk tag v* APK juga masuk Releases.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Push baru ke cabang yang sama membatalkan run lama yang belum selesai (tag tidak dibatalkan).
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GODOT_VERSION: "4.7.2"
  # Versi komponen Android mengikuti platform/android/java/app/config.gradle Godot 4.7.
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.1.0"

jobs:
  test:
    name: Uji klien <-> server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pasang Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Uji ujung-ke-ujung
        run: LOG_DIR="$RUNNER_TEMP/log" scripts/client-test.sh 2>&1 | tee "$RUNNER_TEMP/client-test.log"; exit ${PIPESTATUS[0]}
      - name: Simpan log bila gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-uji-klien
          path: |
            ${{ runner.temp }}/client-test.log
            ${{ runner.temp }}/log/
          if-no-files-found: ignore

  apk:
    name: Bangun APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # untuk melampirkan APK ke Release pada tag v*
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Cache export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Pasang export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv "$RUNNER_TEMP"/templates/templates/* "$dest"/

      - name: Pasang komponen Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null

      - name: Atur Godot untuk ekspor Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Tentukan versi
        id: ver
        run: |
          ver="$(grep '^config/version=' client/project.godot | cut -d'"' -f2)"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::config/version di client/project.godot tidak valid: '$ver'"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$ver" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan versi proyek v$ver. Samakan dulu."; exit 1
          fi
          apk="GamePetualang-v${ver}-build${GITHUB_RUN_NUMBER}.apk"
          # Versi tampilan + nomor build (versionCode naik tiap build agar APK baru bisa menimpa).
          sed -i "s/^version\/name=.*/version\/name=\"${ver}\"/" client/export_presets.cfg
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" client/export_presets.cfg
          # Nomor build dan commit dibaca aplikasi untuk ditampilkan.
          printf 'extends RefCounted\n\nconst BUILD := %s\nconst COMMIT := "%s"\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" > client/scripts/build_info.gd
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "APK: $apk"

      - name: Ekspor APK
        env:
          # Kunci yang sama untuk debug dan rilis (roadmap no. 239-240): tanda tangan APK tidak berubah,
          # sehingga APK baru tetap bisa dipasang menimpa APK lama dan data pemain di HP aman.
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/deploy/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/deploy/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          out="$GITHUB_WORKSPACE/build/${{ steps.ver.outputs.apk }}"
          "$GODOT" --headless --path client --import || true
          set +e
          "$GODOT" --headless --path client --export-release "Android" "$out" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          mode=release
          # Server game memakai HTTP biasa (no. 242): APK rilis wajib mengizinkan lalu lintas tanpa TLS,
          # kalau tidak, HP tidak bisa tersambung. Bila tidak diizinkan, pakai ekspor debug (perilaku lama).
          if [ "$status" = 0 ] && [ -f "$out" ]; then
            ct="$("$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" dump xmltree --file AndroidManifest.xml "$out" | grep -i usesCleartextTraffic || true)"
            echo "usesCleartextTraffic: ${ct:-tidak ada}"
            if ! echo "$ct" | grep -qiE '(=true|0xffffffff)'; then
              echo "::warning title=APK rilis menolak HTTP::memakai ekspor debug supaya tetap tersambung ke server"
              rm -f "$out"; status=1
            fi
          fi
          if [ "$status" != 0 ] || [ ! -f "$out" ]; then
            echo "::warning title=Ekspor rilis gagal::mencoba ekspor debug sebagai cadangan"
            "$GODOT" --headless --path client --export-debug "Android" "$out" 2>&1 | tee -a export.log
            status=${PIPESTATUS[0]}
            mode=debug
          fi
          set -e
          echo "APK_MODE=$mode" >> "$GITHUB_ENV"
          ls -lh build
          if [ "$status" != 0 ] || [ ! -f "$out" ]; then
            # Tampilkan ekor log sebagai anotasi supaya terbaca tanpa membuka log penuh.
            tail_log="$(sed 's/\x1b\[[0-9;]*m//g' export.log | grep -v '^$' | tail -n 25 | tr '\n' '|' | head -c 3000)"
            sdk_info="build-tools=$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ') platforms=$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ') java=$JAVA_HOME"
            echo "::error title=Ekspor APK gagal (exit $status)::${tail_log} || ${sdk_info}"
            exit 1
          fi

      - name: Periksa APK (tanda tangan, versi, izin, ukuran)
        run: |
          bt="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          apk="build/${{ steps.ver.outputs.apk }}"
          # 1) Tanda tangan sah dan sertifikatnya sama dengan kunci proyek (APK bisa menimpa versi lama).
          "$bt/apksigner" verify --print-certs "$apk" | tee signer.txt
          want="$(keytool -list -v -keystore deploy/android/debug.keystore -storepass android -alias androiddebugkey | grep -i 'SHA256:' | head -n1 | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')"
          got="$(grep -i 'certificate SHA-256 digest' signer.txt | head -n1 | sed 's/.*: *//' | tr 'A-F' 'a-f')"
          echo "sertifikat kunci: $want"; echo "sertifikat APK  : $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error title=Tanda tangan APK berbeda::APK tidak akan bisa menimpa versi lama di HP"; exit 1
          fi
          # 2) Paket, versi dan izin sesuai harapan.
          "$bt/aapt2" dump badging "$apk" > badging.txt
          grep -E "^package:|^uses-permission|^sdkVersion|^targetSdkVersion|application-debuggable" badging.txt || true
          grep -q "name='com.miftahulkhoiri.gamepetualang'" badging.txt || { echo "::error::nama paket berubah"; exit 1; }
          grep -q "versionCode='${GITHUB_RUN_NUMBER}'" badging.txt || { echo "::error::versionCode bukan ${GITHUB_RUN_NUMBER}"; exit 1; }
          grep -q "versionName='${{ steps.ver.outputs.version }}'" badging.txt || { echo "::error::versionName bukan ${{ steps.ver.outputs.version }}"; exit 1; }
          grep -q "android.permission.INTERNET" badging.txt || { echo "::error::izin INTERNET hilang"; exit 1; }
          # Kompatibilitas Android (no. 270): pustaka mesin arm64 harus ada, versi Android minimum dicatat.
          grep -q "native-code: 'arm64-v8a'" badging.txt || { echo "::error::pustaka arm64-v8a tidak ada di APK"; exit 1; }
          min_sdk="$(grep -oP "^sdkVersion:'\K[0-9]+" badging.txt || echo '?')"
          target_sdk="$(grep -oP "^targetSdkVersion:'\K[0-9]+" badging.txt || echo '?')"
          echo "Android minimum: API $min_sdk, target: API $target_sdk"
          if [ "$min_sdk" != "?" ] && [ "$min_sdk" -gt 24 ]; then
            echo "::warning title=Android minimum naik::APK butuh API $min_sdk (Android 7 = API 24); HP lama tidak bisa memasang"
          fi
          # 3) Ukuran APK dan isi terbesar (untuk memantau pertumbuhan aset).
          size=$(stat -c %s "$apk")
          echo "Ukuran APK: $((size / 1048576)) MB ($APK_MODE)"
          unzip -lv "$apk" | sort -k3 -n -r | head -n 12
          echo "### APK ${{ steps.ver.outputs.apk }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- mode: $APK_MODE, ukuran: $((size / 1048576)) MB, versionCode: ${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android minimum API $min_sdk, target API $target_sdk, arsitektur arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "- sertifikat SHA-256: \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((80 * 1048576)) ]; then
            echo "::warning title=APK besar::ukuran APK lebih dari 80 MB"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: GamePetualang-v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: build/${{ steps.ver.outputs.apk }}
          if-no-files-found: error

      - name: Lampirkan ke Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/${{ steps.ver.outputs.apk }}
          name: Game Petualang v${{ steps.ver.outputs.version }}
          generate_release_notes: true
