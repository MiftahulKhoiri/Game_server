name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Cakupan tes
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "Cakupan tes server: $(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Build (linux/arm64, target Pi 5)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/gameserver
